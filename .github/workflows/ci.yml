name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # For the chat-server tests that run the history's Lua scripts against a real Redis.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build --workspace apps/chat-server

      - run: npm run build --workspace apps/web

      - run: npm test --workspace apps/chat-server
        env:
          TEST_REDIS_URL: redis://localhost:6379/9

      # These specs do not initialize Payload or need a running database.
      - run: npx vitest run --config ./vitest.config.mts tests/int/env.int.spec.ts
        working-directory: apps/admin

  # The longest of the checks, so it runs beside the others instead of after them.
  web-tests:
    name: Web unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test --workspace apps/web -- --shard=${{ matrix.shard }}/2

      - name: Summarize unit timings and reliability
        if: always()
        run: |
          if [ -f apps/web/test-results/vitest.json ]; then
            node apps/web/scripts/testTimings.mjs apps/web/test-results/vitest.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep unit test timings and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results-${{ matrix.shard }}
          path: apps/web/test-results/vitest.json
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f apps/chat-server/Dockerfile -t chatter-chat-server .

      - run: docker build -f apps/admin/Dockerfile -t chatter-admin .

      - run: docker build -f apps/web/Dockerfile -t chatter-web .

  e2e:
    name: End-to-end (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatter
          POSTGRES_PASSWORD: chatter_ci_password
          POSTGRES_DB: chatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for a database that only exists for this job.
      DATABASE_URL: postgres://chatter:chatter_ci_password@127.0.0.1:5432/chatter
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      SEED_ADMIN_EMAIL: admin@chatter.test
      SEED_ADMIN_PASSWORD: ci-admin-password-1A!
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Write the admin env file
        # The e2e helpers read the admin login from apps/admin/.env, as they do locally.
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL"
            echo "SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD"
          } > apps/admin/.env

      - name: Apply the database migrations
        # Production builds never create tables on their own, so this is how the schema gets there.
        run: npm run migrate --workspace apps/admin

      - name: Check the migrations match the collections
        # Fails when a collection changed without a migration. Payload writes a new file only if the schema differs.
        timeout-minutes: 3
        run: |
          npm run payload --workspace apps/admin -- migrate:create ci_check --skip-empty
          if [ -n "$(git status --porcelain -- apps/admin/src/migrations)" ]; then
            echo "A collection changed without a migration. Run: npm run migrate:create --workspace apps/admin -- <name>" >&2
            git status --porcelain -- apps/admin/src/migrations >&2
            exit 1
          fi

      - name: Check database account-name ownership
        run: npm run test:int --workspace apps/admin -- tests/int/users.int.spec.ts
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed the database and create the chat-server API key
        id: seed
        run: |
          # The output holds the generated API key, so it is only shown if seeding fails.
          # Production mode: a dev-mode run marks the schema as pushed, and the admin then asks before migrating.
          if ! NODE_ENV=production npm run seed --workspace apps/admin > seed.log 2>&1; then
            sed -E 's/[0-9a-f]{64}/***/g' seed.log >&2
            exit 1
          fi
          # Strip terminal colour codes the logger may add around the key.
          key=$(sed 's/\x1b\[[0-9;]*m//g' seed.log | grep -oE 'PAYLOAD_SERVICE_API_KEY in [^:]+: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$key" ]; then
            echo "The seed script did not print a service API key" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          rm seed.log
          {
            echo "PAYLOAD_SERVICE_API_KEY=$key"
            echo "BAN_HASH_SALT=ci-only-ban-salt-not-used-anywhere-else"
            echo "AUTH_TOKEN_SECRET=ci-only-token-secret-not-used-anywhere-else-1234"
          } > apps/chat-server/.env

      - name: Build the admin app
        run: npm run build --workspace apps/admin

      - name: Start the admin app
        timeout-minutes: 5
        run: |
          nohup npm run start --workspace apps/admin > admin.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 http://localhost:3000/api/public-rooms > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Admin did not become ready" >&2
          cat admin.log >&2
          exit 1

      - name: Run the end-to-end tests
        timeout-minutes: 15
        run: npm run test:e2e --workspace apps/web -- --fully-parallel --shard=${{ matrix.shard }}/4

      - name: Summarize browser timings and reliability
        if: always()
        run: |
          if [ -f apps/web/test-results/playwright.json ]; then
            node apps/web/scripts/testTimings.mjs apps/web/test-results/playwright.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep Playwright timings and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            admin.log
          retention-days: 7

  web-tests-result:
    name: Web unit tests
    if: always()
    needs: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.web-tests.result }}" = success

  e2e-result:
    name: End-to-end
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.e2e.result }}" = success
